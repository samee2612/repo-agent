<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>repo-agent</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #273449;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green-bg: #064e3b;
      --green-text: #6ee7b7;
      --red-bg: #7f1d1d;
      --red-text: #fca5a5;
      --amber-bg: #78350f;
      --amber-text: #fcd34d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .status-line {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 480px;
      line-height: 1.5;
    }

    .msg-row {
      display: flex;
      width: 100%;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.agent {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;
      border-radius: 12px;
      padding: 12px 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      border: 1px solid var(--border);
    }

    .msg-row.user .bubble {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      white-space: pre-wrap;
    }

    .msg-row.agent .bubble {
      background: var(--surface);
      width: 100%;
    }

    .msg-row.error .bubble {
      background: var(--red-bg);
      border-color: #ef4444;
      color: var(--red-text);
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .badge.green {
      background: var(--green-bg);
      color: var(--green-text);
    }

    .badge.red {
      background: var(--red-bg);
      color: var(--red-text);
    }

    .badge.amber {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .answer-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status-note {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--amber-bg);
      color: var(--amber-text);
      font-size: 0.85rem;
    }

    .citations {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .citations-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .citation-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .citation-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.82rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    details.trace-box {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }

    details.trace-box summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 600;
      user-select: none;
    }

    .trace-list {
      margin: 8px 0 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .trace-step {
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      word-break: break-word;
    }

    .thinking {
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
      padding: 4px 0;
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
    }

    .composer {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 150px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>repo-agent</h1>
      <span id="status-line" class="status-line">Checking index status...</span>
    </div>
    <div class="header-actions">
      <button id="index-btn" type="button">Index sample repo</button>
    </div>
  </header>

  <main id="chat">
    <div id="empty-state" class="empty-state">
      Click <strong>Index sample repo</strong> to index the codebase, then ask a question below.
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea
        id="question-input"
        rows="1"
        placeholder="Ask a question about the repository... (Enter to send, Shift+Enter for newline)"
      ></textarea>
      <button id="send-btn" type="button">Send</button>
    </div>
  </footer>

  <script>
    const statusLine = document.getElementById("status-line");
    const indexBtn = document.getElementById("index-btn");
    const chatEl = document.getElementById("chat");
    const emptyState = document.getElementById("empty-state");
    const questionInput = document.getElementById("question-input");
    const sendBtn = document.getElementById("send-btn");

    let isRequestInFlight = false;

    function clearEmptyState() {
      if (emptyState && emptyState.parentNode) {
        emptyState.parentNode.removeChild(emptyState);
      }
    }

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function renderIndexStatus(data) {
      if (data.indexed) {
        statusLine.textContent =
          "Indexed: " +
          data.files +
          " files, " +
          data.chunks +
          " chunks, " +
          data.edges +
          " edges";
      } else {
        statusLine.textContent = "Not indexed";
      }
    }

    async function fetchIndexStatus() {
      try {
        const res = await fetch("/index/status");
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        const data = await res.json();
        renderIndexStatus(data);
      } catch (err) {
        statusLine.textContent = "Status unavailable: " + err.message;
      }
    }

    function appendUserMessage(text) {
      clearEmptyState();
      const row = document.createElement("div");
      row.className = "msg-row user";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
    }

    function appendErrorMessage(text) {
      clearEmptyState();
      const row = document.createElement("div");
      row.className = "msg-row error";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = "Error: " + text;

      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
    }

    function appendAgentMessage(data) {
      clearEmptyState();
      const row = document.createElement("div");
      row.className = "msg-row agent";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const badgeRow = document.createElement("div");
      badgeRow.className = "badge-row";

      const groundedBadge = document.createElement("span");
      groundedBadge.className = "badge " + (data.grounded ? "green" : "red");
      groundedBadge.textContent = data.grounded ? "Grounded" : "Not fully grounded";
      badgeRow.appendChild(groundedBadge);

      if (data.status && data.status !== "ok") {
        const statusBadge = document.createElement("span");
        statusBadge.className = "badge amber";
        statusBadge.textContent = data.status;
        badgeRow.appendChild(statusBadge);
      }
      bubble.appendChild(badgeRow);

      const answerEl = document.createElement("div");
      answerEl.className = "answer-text";
      answerEl.textContent = data.answer || "";
      bubble.appendChild(answerEl);

      if (data.status === "step_limit" || data.status === "timeout") {
        const noteEl = document.createElement("div");
        noteEl.className = "status-note";
        noteEl.textContent =
          data.status === "step_limit"
            ? "Note: Agent reached the maximum tool round limit (8) and returned partial evidence."
            : "Note: Agent reached the 60s timeout and returned partial evidence.";
        bubble.appendChild(noteEl);
      }

      if (Array.isArray(data.citations) && data.citations.length > 0) {
        const citationsBox = document.createElement("div");
        citationsBox.className = "citations";

        const title = document.createElement("div");
        title.className = "citations-title";
        title.textContent = "Citations";
        citationsBox.appendChild(title);

        const list = document.createElement("ul");
        list.className = "citation-list";

        for (const cit of data.citations) {
          const li = document.createElement("li");
          li.className = "citation-item";

          const loc = document.createElement("span");
          loc.textContent = cit.path + ":" + cit.start_line + "-" + cit.end_line;
          li.appendChild(loc);

          const badge = document.createElement("span");
          badge.className = "badge " + (cit.verified ? "green" : "red");
          badge.textContent = cit.verified ? "verified" : "unverified";
          li.appendChild(badge);

          list.appendChild(li);
        }

        citationsBox.appendChild(list);
        bubble.appendChild(citationsBox);
      }

      if (Array.isArray(data.trace) && data.trace.length > 0) {
        const details = document.createElement("details");
        details.className = "trace-box";

        const summary = document.createElement("summary");
        summary.textContent = "Agent steps (" + data.trace.length + ")";
        details.appendChild(summary);

        const traceList = document.createElement("ol");
        traceList.className = "trace-list";

        for (const step of data.trace) {
          const li = document.createElement("li");
          li.className = "trace-step";
          const inputText = JSON.stringify(step.input || {});
          li.textContent =
            step.tool + "(" + inputText + ") -> " + (step.result_summary || "");
          traceList.appendChild(li);
        }

        details.appendChild(traceList);
        bubble.appendChild(details);
      }

      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
    }

    function setSendingState(sending) {
      isRequestInFlight = sending;
      sendBtn.disabled = sending;
      questionInput.disabled = sending;
    }

    async function parseJsonSafe(res) {
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        return { detail: text || ("HTTP " + res.status) };
      }
    }

    async function handleIndexClick() {
      indexBtn.disabled = true;
      const originalText = indexBtn.textContent;
      indexBtn.textContent = "Indexing...";
      try {
        const res = await fetch("/index", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });
        const data = await parseJsonSafe(res);
        if (!res.ok) {
          throw new Error(data.detail || "HTTP " + res.status);
        }
        renderIndexStatus(data);
      } catch (err) {
        appendErrorMessage("Indexing failed: " + err.message);
      } finally {
        indexBtn.disabled = false;
        indexBtn.textContent = originalText;
      }
    }

    async function handleSend() {
      if (isRequestInFlight) return;
      const question = questionInput.value.trim();
      if (!question) return;

      questionInput.value = "";
      appendUserMessage(question);
      setSendingState(true);

      const thinkingEl = document.createElement("div");
      thinkingEl.className = "thinking";
      thinkingEl.textContent = "Thinking...";
      chatEl.appendChild(thinkingEl);
      scrollToBottom();

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await parseJsonSafe(res);
        if (!res.ok) {
          throw new Error(data.detail || "HTTP " + res.status);
        }
        if (thinkingEl.parentNode) thinkingEl.parentNode.removeChild(thinkingEl);
        appendAgentMessage(data);
      } catch (err) {
        if (thinkingEl.parentNode) thinkingEl.parentNode.removeChild(thinkingEl);
        appendErrorMessage(err.message);
      } finally {
        setSendingState(false);
        questionInput.focus();
      }
    }

    indexBtn.addEventListener("click", handleIndexClick);
    sendBtn.addEventListener("click", handleSend);
    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        handleSend();
      }
    });

    fetchIndexStatus();
  </script>
</body>
</html>
