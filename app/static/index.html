<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>repo-agent</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #273449;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green-bg: #064e3b;
      --green-text: #6ee7b7;
      --red-bg: #7f1d1d;
      --red-text: #fca5a5;
      --amber-bg: #78350f;
      --amber-text: #fcd34d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .status-line {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.secondary:hover:not(:disabled) {
      background: #334155;
    }

    .workspace {
      flex: 1;
      display: flex;
      min-height: 0;
      width: 100%;
    }

    .chat-pane {
      width: 45%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      min-height: 0;
    }

    .graph-pane {
      width: 55%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #0b1220;
    }

    @media (max-width: 900px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }
      .workspace {
        flex-direction: column;
      }
      .chat-pane,
      .graph-pane {
        width: 100%;
        border-right: none;
      }
      .chat-pane {
        height: 55vh;
        border-bottom: 1px solid var(--border);
      }
      .graph-pane {
        height: 55vh;
      }
    }

    main#chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.5;
    }

    .msg-row {
      display: flex;
      width: 100%;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.agent {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 90%;
      border-radius: 12px;
      padding: 12px 14px;
      line-height: 1.5;
      font-size: 0.92rem;
      border: 1px solid var(--border);
    }

    .msg-row.user .bubble {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      white-space: pre-wrap;
    }

    .msg-row.agent .bubble {
      background: var(--surface);
      width: 100%;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .msg-row.agent .bubble.active-answer {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.35);
    }

    .msg-row.error .bubble {
      background: var(--red-bg);
      border-color: #ef4444;
      color: var(--red-text);
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .badge.green {
      background: var(--green-bg);
      color: var(--green-text);
    }

    .badge.red {
      background: var(--red-bg);
      color: var(--red-text);
    }

    .badge.amber {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .answer-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status-note {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--amber-bg);
      color: var(--amber-text);
      font-size: 0.82rem;
    }

    .citations {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .citations-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .citation-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .citation-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .citation-item:hover,
    .citation-item.hovered {
      border-color: var(--accent);
      background: #1e3a5f;
    }

    details.trace-box {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
    }

    details.trace-box summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 600;
      user-select: none;
    }

    .trace-list {
      margin: 8px 0 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .trace-step {
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      word-break: break-word;
    }

    .thinking {
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
      padding: 4px 0;
    }

    .composer-wrap {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }

    .composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 140px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.92rem;
      line-height: 1.4;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    .graph-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .graph-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.78rem;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-right: 4px;
    }

    .graph-note {
      padding: 8px 16px;
      background: var(--amber-bg);
      color: var(--amber-text);
      font-size: 0.82rem;
      border-bottom: 1px solid var(--border);
      display: none;
    }

    .graph-canvas-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    #graph-canvas {
      width: 100%;
      height: 100%;
    }

    .graph-fallback {
      padding: 16px;
      overflow-y: auto;
      height: 100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .node-details {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      font-size: 0.82rem;
      max-height: 160px;
      overflow-y: auto;
    }

    .node-details-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .node-details-meta {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
    }

    .node-details-cites {
      margin: 6px 0 0;
      padding-left: 16px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>repo-agent</h1>
      <span id="status-line" class="status-line">Checking index status...</span>
    </div>
    <div class="header-actions">
      <button id="index-btn" type="button">Index sample repo</button>
    </div>
  </header>

  <div class="workspace">
    <section class="chat-pane">
      <main id="chat">
        <div id="empty-state" class="empty-state">
          Click <strong>Index sample repo</strong> to index the codebase, then ask a question below.
        </div>
      </main>
      <div class="composer-wrap">
        <div class="composer">
          <textarea
            id="question-input"
            rows="1"
            placeholder="Ask a question about the repository... (Enter to send, Shift+Enter for newline)"
          ></textarea>
          <button id="send-btn" type="button">Send</button>
        </div>
      </div>
    </section>

    <section class="graph-pane">
      <div class="graph-toolbar">
        <div class="graph-legend">
          <span><span class="legend-dot" style="background:#3b82f6"></span>Target</span>
          <span><span class="legend-dot" style="background:#10b981"></span>Cited / Dependent</span>
          <span><span class="legend-dot" style="background:#ef4444"></span>Unverified</span>
          <span>Dashed: imports · Solid: calls</span>
        </div>
        <button id="clear-highlight-btn" class="secondary" type="button">Clear highlight</button>
      </div>
      <div id="graph-note" class="graph-note"></div>
      <div class="graph-canvas-wrap">
        <div id="graph-canvas"></div>
      </div>
      <div id="node-details" class="node-details">
        <div class="node-details-title">Node details</div>
        <div class="node-details-meta">Click a node in the dependency graph to inspect it.</div>
      </div>
    </section>
  </div>

  <script>
    const statusLine = document.getElementById("status-line");
    const indexBtn = document.getElementById("index-btn");
    const clearHighlightBtn = document.getElementById("clear-highlight-btn");
    const chatEl = document.getElementById("chat");
    const emptyState = document.getElementById("empty-state");
    const questionInput = document.getElementById("question-input");
    const sendBtn = document.getElementById("send-btn");
    const graphCanvas = document.getElementById("graph-canvas");
    const graphNote = document.getElementById("graph-note");
    const nodeDetailsEl = document.getElementById("node-details");

    let isRequestInFlight = false;
    let rawGraph = { nodes: [], edges: [] };
    let visNetwork = null;
    let nodesDataset = null;
    let edgesDataset = null;
    let activeHighlight = null;
    let activeBubbleEl = null;

    // Session tracking for answers and citation-to-node links.
    const sessionAnswers = [];
    const citationElements = [];

    function clearEmptyState() {
      if (emptyState && emptyState.parentNode) {
        emptyState.parentNode.removeChild(emptyState);
      }
    }

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function parseJsonSafe(res) {
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        return { detail: text || ("HTTP " + res.status) };
      }
    }

    function renderIndexStatus(data) {
      if (data.indexed) {
        statusLine.textContent =
          "Indexed: " + data.files + " files, " + data.chunks + " chunks, " + data.edges + " edges";
      } else {
        statusLine.textContent = "Not indexed";
      }
    }

    async function fetchIndexStatus() {
      try {
        const res = await fetch("/index/status");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await parseJsonSafe(res);
        renderIndexStatus(data);
      } catch (err) {
        statusLine.textContent = "Status unavailable: " + err.message;
      }
    }

    function baseNodeStyle(node) {
      const isFile = node.kind === "file";
      return {
        id: node.id,
        label: node.label,
        shape: isFile ? "box" : "ellipse",
        color: {
          background: isFile ? "#1e293b" : "#0f3443",
          border: isFile ? "#64748b" : "#38bdf8",
          highlight: {
            background: isFile ? "#334155" : "#155e75",
            border: "#93c5fd",
          },
        },
        font: { color: "#f1f5f9", size: 13 },
        borderWidth: 1.5,
        shapeProperties: { borderDashes: false },
      };
    }

    function baseEdgeStyle(edge, idx) {
      const isImport = edge.kind === "imports";
      return {
        id: "e:" + idx + ":" + edge.source + "->" + edge.target + ":" + edge.kind,
        from: edge.source,
        to: edge.target,
        dashes: isImport,
        arrows: "to",
        color: { color: "#64748b", opacity: 0.75 },
        width: 1.4,
      };
    }

    function findMatchingGraphNodesForCitation(cit) {
      const matches = [];
      for (const n of rawGraph.nodes) {
        if (n.kind === "file" && n.id === cit.path) {
          matches.push(n.id);
        } else if (
          n.kind !== "file" &&
          n.path === cit.path &&
          cit.start_line <= (n.end_line || 0) &&
          (n.start_line || 0) <= cit.end_line
        ) {
          matches.push(n.id);
        }
      }
      return matches;
    }

    function renderGraphFallback(reason) {
      graphCanvas.textContent = "";
      const box = document.createElement("div");
      box.className = "graph-fallback";

      const heading = document.createElement("div");
      heading.textContent = reason + " Showing text fallback:";
      heading.style.marginBottom = "10px";
      heading.style.color = "#f1f5f9";
      box.appendChild(heading);

      const nodesTitle = document.createElement("div");
      nodesTitle.textContent = "Nodes (" + rawGraph.nodes.length + "):";
      box.appendChild(nodesTitle);

      const nodeList = document.createElement("ul");
      for (const n of rawGraph.nodes) {
        const li = document.createElement("li");
        li.textContent = n.id + " [" + n.kind + "]";
        nodeList.appendChild(li);
      }
      box.appendChild(nodeList);

      const edgesTitle = document.createElement("div");
      edgesTitle.textContent = "Edges (" + rawGraph.edges.length + "):";
      edgesTitle.style.marginTop = "10px";
      box.appendChild(edgesTitle);

      const edgeList = document.createElement("ul");
      for (const e of rawGraph.edges) {
        const li = document.createElement("li");
        li.textContent = e.source + " -[" + e.kind + "]-> " + e.target;
        edgeList.appendChild(li);
      }
      box.appendChild(edgeList);
      graphCanvas.appendChild(box);
    }

    function renderGraph(data) {
      rawGraph = data || { nodes: [], edges: [] };
      if (typeof vis === "undefined" || !vis.Network) {
        renderGraphFallback("vis-network CDN unavailable.");
        return;
      }

      graphCanvas.textContent = "";
      nodesDataset = new vis.DataSet(rawGraph.nodes.map(baseNodeStyle));
      edgesDataset = new vis.DataSet(rawGraph.edges.map(baseEdgeStyle));

      const options = {
        interaction: {
          hover: true,
          tooltipDelay: 150,
        },
        physics: {
          enabled: true,
          barnesHut: {
            gravitationalConstant: -3500,
            springLength: 140,
            springConstant: 0.04,
          },
          stabilization: {
            iterations: 160,
          },
        },
        layout: {
          improvedLayout: true,
        },
      };

      visNetwork = new vis.Network(
        graphCanvas,
        { nodes: nodesDataset, edges: edgesDataset },
        options
      );

      visNetwork.once("stabilized", () => {
        if (visNetwork) {
          visNetwork.setOptions({ physics: { enabled: false } });
        }
      });

      visNetwork.on("click", (params) => {
        if (params.nodes && params.nodes.length > 0) {
          showNodeDetails(params.nodes[0]);
        }
      });

      visNetwork.on("hoverNode", (params) => {
        highlightChatCitationsForNode(params.node, true);
      });

      visNetwork.on("blurNode", () => {
        highlightChatCitationsForNode(null, false);
      });

      if (activeHighlight) {
        applyHighlight(activeHighlight.highlight, activeHighlight.status);
      }
    }

    async function fetchGraph() {
      try {
        const res = await fetch("/graph");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await parseJsonSafe(res);
        renderGraph(data);
      } catch (err) {
        renderGraphFallback("Failed to load graph: " + err.message);
      }
    }

    function applyHighlight(highlight, status) {
      activeHighlight = highlight ? { highlight, status } : null;

      if (status === "step_limit" || status === "timeout") {
        graphNote.style.display = "block";
        graphNote.textContent = "Partial evidence only.";
      } else {
        graphNote.style.display = "none";
        graphNote.textContent = "";
      }

      if (!nodesDataset || !edgesDataset) return;

      if (!highlight) {
        nodesDataset.update(rawGraph.nodes.map(baseNodeStyle));
        edgesDataset.update(rawGraph.edges.map(baseEdgeStyle));
        return;
      }

      const hlNodes = new Set(highlight.nodes || []);
      const targetNodes = new Set(highlight.target_nodes || []);
      const unverifiedNodes = new Set(highlight.unverified_nodes || []);
      const hlEdges = new Set(
        (highlight.edges || []).map((e) => e.source + "->" + e.target + ":" + e.kind)
      );

      const nodeUpdates = rawGraph.nodes.map((node) => {
        const base = baseNodeStyle(node);
        if (unverifiedNodes.has(node.id)) {
          return {
            ...base,
            color: { background: "#7f1d1d", border: "#ef4444" },
            font: { color: "#fecaca", size: 13 },
            borderWidth: 2.5,
            shapeProperties: { borderDashes: [5, 5] },
          };
        }
        if (targetNodes.has(node.id)) {
          return {
            ...base,
            color: { background: "#1d4ed8", border: "#60a5fa" },
            font: { color: "#ffffff", size: 14 },
            borderWidth: 2.5,
          };
        }
        if (hlNodes.has(node.id)) {
          return {
            ...base,
            color: { background: "#065f46", border: "#10b981" },
            font: { color: "#ecfdf5", size: 13 },
            borderWidth: 2.5,
          };
        }
        return {
          ...base,
          color: { background: "#111827", border: "#1f2937" },
          font: { color: "#475569", size: 12 },
          borderWidth: 1,
        };
      });

      const edgeUpdates = rawGraph.edges.map((edge, idx) => {
        const base = baseEdgeStyle(edge, idx);
        const key = edge.source + "->" + edge.target + ":" + edge.kind;
        if (hlEdges.has(key)) {
          return {
            ...base,
            color: { color: "#34d399", opacity: 1.0 },
            width: 2.6,
          };
        }
        return {
          ...base,
          color: { color: "#334155", opacity: 0.2 },
          width: 1,
        };
      });

      nodesDataset.update(nodeUpdates);
      edgesDataset.update(edgeUpdates);
    }

    function showNodeDetails(nodeId) {
      const node = rawGraph.nodes.find((n) => n.id === nodeId);
      nodeDetailsEl.textContent = "";

      const title = document.createElement("div");
      title.className = "node-details-title";
      title.textContent = node ? node.id : nodeId;
      nodeDetailsEl.appendChild(title);

      const meta = document.createElement("div");
      meta.className = "node-details-meta";
      if (node) {
        let info = "kind: " + node.kind;
        if (node.start_line && node.end_line) {
          info += " | lines: " + node.start_line + "-" + node.end_line;
        }
        meta.textContent = info;
      } else {
        meta.textContent = "Node not in current graph.";
      }
      nodeDetailsEl.appendChild(meta);

      const citingAnswers = sessionAnswers.filter((entry) =>
        entry.citedNodeIds.has(nodeId)
      );
      if (citingAnswers.length > 0) {
        const list = document.createElement("ul");
        list.className = "node-details-cites";
        for (const ans of citingAnswers) {
          const li = document.createElement("li");
          li.textContent = "Q: " + ans.question;
          list.appendChild(li);
        }
        nodeDetailsEl.appendChild(list);
      }
    }

    function highlightChatCitationsForNode(nodeId, isHovering) {
      for (const item of citationElements) {
        if (isHovering && nodeId && item.nodeIds.includes(nodeId)) {
          item.el.classList.add("hovered");
        } else {
          item.el.classList.remove("hovered");
        }
      }
    }

    function focusNodeInGraph(nodeId) {
      if (!visNetwork || !nodesDataset || !nodesDataset.get(nodeId)) return;
      visNetwork.selectNodes([nodeId]);
      visNetwork.focus(nodeId, { scale: 1.2, animation: { duration: 350 } });
      showNodeDetails(nodeId);
    }

    function appendUserMessage(text) {
      clearEmptyState();
      const row = document.createElement("div");
      row.className = "msg-row user";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
    }

    function appendErrorMessage(text) {
      clearEmptyState();
      const row = document.createElement("div");
      row.className = "msg-row error";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = "Error: " + text;

      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
    }

    function setActiveAnswerBubble(bubble, highlight, status) {
      if (activeBubbleEl) {
        activeBubbleEl.classList.remove("active-answer");
      }
      activeBubbleEl = bubble;
      if (bubble) {
        bubble.classList.add("active-answer");
      }
      applyHighlight(highlight, status);
    }

    function appendAgentMessage(questionText, data) {
      clearEmptyState();
      const row = document.createElement("div");
      row.className = "msg-row agent";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const citedNodeIds = new Set();
      if (Array.isArray(data.citations)) {
        for (const cit of data.citations) {
          for (const nid of findMatchingGraphNodesForCitation(cit)) {
            citedNodeIds.add(nid);
          }
        }
      }
      sessionAnswers.push({ question: questionText, data, citedNodeIds });

      bubble.addEventListener("click", () => {
        setActiveAnswerBubble(bubble, data.highlight, data.status);
      });

      const badgeRow = document.createElement("div");
      badgeRow.className = "badge-row";

      const groundedBadge = document.createElement("span");
      groundedBadge.className = "badge " + (data.grounded ? "green" : "red");
      groundedBadge.textContent = data.grounded ? "Grounded" : "Not fully grounded";
      badgeRow.appendChild(groundedBadge);

      if (data.status && data.status !== "ok") {
        const statusBadge = document.createElement("span");
        statusBadge.className = "badge amber";
        statusBadge.textContent = data.status;
        badgeRow.appendChild(statusBadge);
      }
      bubble.appendChild(badgeRow);

      const answerEl = document.createElement("div");
      answerEl.className = "answer-text";
      answerEl.textContent = data.answer || "";
      bubble.appendChild(answerEl);

      if (data.status === "step_limit" || data.status === "timeout") {
        const noteEl = document.createElement("div");
        noteEl.className = "status-note";
        noteEl.textContent =
          data.status === "step_limit"
            ? "Note: Agent reached the maximum tool round limit (8) and returned partial evidence."
            : "Note: Agent reached the 60s timeout and returned partial evidence.";
        bubble.appendChild(noteEl);
      }

      if (Array.isArray(data.citations) && data.citations.length > 0) {
        const citationsBox = document.createElement("div");
        citationsBox.className = "citations";

        const title = document.createElement("div");
        title.className = "citations-title";
        title.textContent = "Citations";
        citationsBox.appendChild(title);

        const list = document.createElement("ul");
        list.className = "citation-list";

        for (const cit of data.citations) {
          const li = document.createElement("li");
          li.className = "citation-item";

          const matchedNodes = findMatchingGraphNodesForCitation(cit);
          citationElements.push({ el: li, nodeIds: matchedNodes });

          const loc = document.createElement("span");
          loc.textContent = cit.path + ":" + cit.start_line + "-" + cit.end_line;
          li.appendChild(loc);

          const badge = document.createElement("span");
          badge.className = "badge " + (cit.verified ? "green" : "red");
          badge.textContent = cit.verified ? "verified" : "unverified";
          li.appendChild(badge);

          li.addEventListener("click", (event) => {
            event.stopPropagation();
            setActiveAnswerBubble(bubble, data.highlight, data.status);
            if (matchedNodes.length > 0) {
              // Prefer symbol node over file node if available.
              const symbolNode = matchedNodes.find((id) => id.includes("::"));
              focusNodeInGraph(symbolNode || matchedNodes[0]);
            }
          });

          list.appendChild(li);
        }

        citationsBox.appendChild(list);
        bubble.appendChild(citationsBox);
      }

      if (Array.isArray(data.trace) && data.trace.length > 0) {
        const details = document.createElement("details");
        details.className = "trace-box";
        details.addEventListener("click", (e) => e.stopPropagation());

        const summary = document.createElement("summary");
        summary.textContent = "Agent steps (" + data.trace.length + ")";
        details.appendChild(summary);

        const traceList = document.createElement("ol");
        traceList.className = "trace-list";

        for (const step of data.trace) {
          const li = document.createElement("li");
          li.className = "trace-step";
          const inputText = JSON.stringify(step.input || {});
          li.textContent =
            step.tool + "(" + inputText + ") -> " + (step.result_summary || "");
          traceList.appendChild(li);
        }

        details.appendChild(traceList);
        bubble.appendChild(details);
      }

      row.appendChild(bubble);
      chatEl.appendChild(row);
      setActiveAnswerBubble(bubble, data.highlight, data.status);
      scrollToBottom();
    }

    function setSendingState(sending) {
      isRequestInFlight = sending;
      sendBtn.disabled = sending;
      questionInput.disabled = sending;
    }

    async function handleIndexClick() {
      indexBtn.disabled = true;
      const originalText = indexBtn.textContent;
      indexBtn.textContent = "Indexing...";
      try {
        const res = await fetch("/index", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });
        const data = await parseJsonSafe(res);
        if (!res.ok) {
          throw new Error(data.detail || "HTTP " + res.status);
        }
        renderIndexStatus(data);
        activeHighlight = null;
        await fetchGraph();
      } catch (err) {
        appendErrorMessage("Indexing failed: " + err.message);
      } finally {
        indexBtn.disabled = false;
        indexBtn.textContent = originalText;
      }
    }

    async function handleSend() {
      if (isRequestInFlight) return;
      const question = questionInput.value.trim();
      if (!question) return;

      questionInput.value = "";
      appendUserMessage(question);
      setSendingState(true);

      const thinkingEl = document.createElement("div");
      thinkingEl.className = "thinking";
      thinkingEl.textContent = "Thinking...";
      chatEl.appendChild(thinkingEl);
      scrollToBottom();

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await parseJsonSafe(res);
        if (!res.ok) {
          throw new Error(data.detail || "HTTP " + res.status);
        }
        if (thinkingEl.parentNode) thinkingEl.parentNode.removeChild(thinkingEl);
        appendAgentMessage(question, data);
      } catch (err) {
        if (thinkingEl.parentNode) thinkingEl.parentNode.removeChild(thinkingEl);
        appendErrorMessage(err.message);
      } finally {
        setSendingState(false);
        questionInput.focus();
      }
    }

    indexBtn.addEventListener("click", handleIndexClick);
    clearHighlightBtn.addEventListener("click", () => {
      setActiveAnswerBubble(null, null, null);
    });
    sendBtn.addEventListener("click", handleSend);
    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        handleSend();
      }
    });

    fetchIndexStatus();
    fetchGraph();
  </script>
</body>
</html>
