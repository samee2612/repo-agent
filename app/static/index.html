<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>repo-agent</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #273449;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green-bg: #064e3b;
      --green-text: #6ee7b7;
      --red-bg: #7f1d1d;
      --red-text: #fca5a5;
      --amber-bg: #78350f;
      --amber-text: #fcd34d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .status-line {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    main#chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 460px;
      line-height: 1.5;
    }

    .msg-row {
      display: flex;
      width: 100%;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.agent {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 85%;
      border-radius: 12px;
      padding: 14px 18px;
      line-height: 1.55;
      font-size: 0.95rem;
      border: 1px solid var(--border);
    }

    .msg-row.user .bubble {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      white-space: pre-wrap;
    }

    .msg-row.agent .bubble {
      background: var(--surface);
      width: 100%;
      max-width: 100%;
    }

    .msg-row.error .bubble {
      background: var(--red-bg);
      border-color: #ef4444;
      color: var(--red-text);
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .badge.green {
      background: var(--green-bg);
      color: var(--green-text);
    }

    .badge.red {
      background: var(--red-bg);
      color: var(--red-text);
    }

    .badge.amber {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .answer-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .answer-heading {
      margin: 6px 0 2px;
      font-size: 0.98rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    .answer-para {
      margin: 0;
      color: var(--text);
      line-height: 1.6;
    }

    .answer-list {
      margin: 2px 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .answer-list li {
      line-height: 1.55;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      list-style-type: none;
    }

    .answer-list {
      padding-left: 0;
    }

    .inline-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.84rem;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 5px;
      color: #93c5fd;
    }

    .answer-table-wrap {
      overflow-x: auto;
      margin: 4px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table.answer-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    table.answer-table th,
    table.answer-table td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    table.answer-table th {
      background: var(--surface-alt);
      color: #cbd5e1;
      font-weight: 600;
    }

    table.answer-table tr:last-child td {
      border-bottom: none;
    }

    .status-note {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--amber-bg);
      color: var(--amber-text);
      font-size: 0.85rem;
    }

    .citations {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .citations-title {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .citation-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .citation-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.82rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    details.trace-box {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.84rem;
    }

    details.trace-box summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 600;
      user-select: none;
    }

    .trace-list {
      margin: 8px 0 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .trace-step {
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      word-break: break-word;
    }

    .thinking {
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
      padding: 4px 0;
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
    }

    .sample-questions {
      max-width: 880px;
      margin: 0 auto 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .sample-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-right: 4px;
    }

    .sample-chip {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .sample-chip:hover:not(:disabled) {
      background: #1e3a5f;
      border-color: var(--accent);
    }

    .sample-chip strong {
      color: #93c5fd;
      margin-right: 4px;
    }

    .composer {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 150px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>repo-agent</h1>
      <span id="status-line" class="status-line">Checking index status...</span>
    </div>
    <div class="header-actions">
      <button id="index-btn" type="button">Index sample repo</button>
    </div>
  </header>

  <main id="chat">
    <div id="empty-state" class="empty-state">
      Click <strong>Index sample repo</strong> to index the codebase, then click a sample question or type your own below.
    </div>
  </main>

  <footer>
    <div class="sample-questions">
      <span class="sample-label">Try:</span>
      <button
        type="button"
        class="sample-chip"
        data-question="Where is login defined and what parameters does it take?"
      >
        <strong>Lookup:</strong> Where is login defined and what parameters does it take?
      </button>
      <button
        type="button"
        class="sample-chip"
        data-question="Which modules or functions depend on shop/auth.py::check_rate_limit?"
      >
        <strong>Dependency:</strong> Which modules or functions depend on shop/auth.py::check_rate_limit?
      </button>
      <button
        type="button"
        class="sample-chip"
        data-question="How does place_order validate a user request before accepting an order?"
      >
        <strong>Explain:</strong> How does place_order validate a user request before accepting an order?
      </button>
    </div>
    <div class="composer">
      <textarea
        id="question-input"
        rows="1"
        placeholder="Ask a question about the repository... (Enter to send, Shift+Enter for newline)"
      ></textarea>
      <button id="send-btn" type="button">Send</button>
    </div>
  </footer>

  <script>
    const statusLine = document.getElementById("status-line");
    const indexBtn = document.getElementById("index-btn");
    const chatEl = document.getElementById("chat");
    const emptyState = document.getElementById("empty-state");
    const questionInput = document.getElementById("question-input");
    const sendBtn = document.getElementById("send-btn");

    let isRequestInFlight = false;

    function clearEmptyState() {
      if (emptyState && emptyState.parentNode) {
        emptyState.parentNode.removeChild(emptyState);
      }
    }

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function parseJsonSafe(res) {
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        return { detail: text || ("HTTP " + res.status) };
      }
    }

    function renderIndexStatus(data) {
      if (data.indexed) {
        statusLine.textContent =
          "Indexed: " + data.files + " files, " + data.chunks + " chunks, " + data.edges + " edges";
      } else {
        statusLine.textContent = "Not indexed";
      }
    }

    async function fetchIndexStatus() {
      try {
        const res = await fetch("/index/status");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await parseJsonSafe(res);
        renderIndexStatus(data);
      } catch (err) {
        statusLine.textContent = "Status unavailable: " + err.message;
      }
    }

    // Safely render inline **bold** and `code` tokens using createElement/textContent only.
    function appendFormattedInline(container, text) {
      const pattern = /(\*\*[^*]+\*\*|`[^`]+`)/g;
      let lastIndex = 0;
      let match;
      while ((match = pattern.exec(text)) !== null) {
        if (match.index > lastIndex) {
          container.appendChild(
            document.createTextNode(text.slice(lastIndex, match.index))
          );
        }
        const token = match[0];
        if (token.startsWith("**") && token.endsWith("**")) {
          const strong = document.createElement("strong");
          strong.textContent = token.slice(2, -2);
          container.appendChild(strong);
        } else if (token.startsWith("`") && token.endsWith("`")) {
          const code = document.createElement("code");
          code.className = "inline-code";
          code.textContent = token.slice(1, -1);
          container.appendChild(code);
        }
        lastIndex = pattern.lastIndex;
      }
      if (lastIndex < text.length) {
        container.appendChild(document.createTextNode(text.slice(lastIndex)));
      }
    }

    function parseTableRow(line) {
      let trimmed = line.trim();
      if (trimmed.startsWith("|")) trimmed = trimmed.slice(1);
      if (trimmed.endsWith("|")) trimmed = trimmed.slice(0, -1);
      return trimmed.split("|").map((c) => c.trim());
    }

    function isTableSeparator(line) {
      return /^\|?[\s:-]+\|[\s|:-]*$/.test(line.trim());
    }

    // Safely build structured DOM elements (headings, cards/bullets, tables, paragraphs) without innerHTML.
    function renderStructuredAnswer(text) {
      const container = document.createElement("div");
      container.className = "answer-body";
      const lines = (text || "").split(/\r?\n/);

      let i = 0;
      while (i < lines.length) {
        const rawLine = lines[i];
        const line = rawLine.trim();

        if (!line) {
          i++;
          continue;
        }

        // Markdown table block
        if (
          line.includes("|") &&
          i + 1 < lines.length &&
          isTableSeparator(lines[i + 1])
        ) {
          const wrap = document.createElement("div");
          wrap.className = "answer-table-wrap";
          const table = document.createElement("table");
          table.className = "answer-table";

          const thead = document.createElement("thead");
          const trHead = document.createElement("tr");
          for (const cell of parseTableRow(line)) {
            const th = document.createElement("th");
            appendFormattedInline(th, cell);
            trHead.appendChild(th);
          }
          thead.appendChild(trHead);
          table.appendChild(thead);

          i += 2;
          const tbody = document.createElement("tbody");
          while (i < lines.length && lines[i].trim().includes("|")) {
            const rowCells = parseTableRow(lines[i]);
            const tr = document.createElement("tr");
            for (const cell of rowCells) {
              const td = document.createElement("td");
              appendFormattedInline(td, cell);
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
            i++;
          }
          table.appendChild(tbody);
          wrap.appendChild(table);
          container.appendChild(wrap);
          continue;
        }

        // Heading
        if (/^#{1,4}\s+/.test(line)) {
          const h = document.createElement("div");
          h.className = "answer-heading";
          appendFormattedInline(h, line.replace(/^#{1,4}\s+/, ""));
          container.appendChild(h);
          i++;
          continue;
        }

        // Bullet or numbered list block
        if (/^([-*•]|\d+\.)\s+/.test(line)) {
          const ul = document.createElement("ul");
          ul.className = "answer-list";
          while (i < lines.length && /^([-*•]|\d+\.)\s+/.test(lines[i].trim())) {
            const li = document.createElement("li");
            const itemText = lines[i].trim().replace(/^([-*•]|\d+\.)\s+/, "");
            appendFormattedInline(li, itemText);
            ul.appendChild(li);
            i++;
          }
          container.appendChild(ul);
          continue;
        }

        // Regular paragraph
        const p = document.createElement("p");
        p.className = "answer-para";
        appendFormattedInline(p, line);
        container.appendChild(p);
        i++;
      }

      return container;
    }

    function appendUserMessage(text) {
      clearEmptyState();
      const row = document.createElement("div");
      row.className = "msg-row user";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
    }

    function appendErrorMessage(text) {
      clearEmptyState();
      const row = document.createElement("div");
      row.className = "msg-row error";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = "Error: " + text;

      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
    }

    function appendAgentMessage(data) {
      clearEmptyState();
      const row = document.createElement("div");
      row.className = "msg-row agent";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const badgeRow = document.createElement("div");
      badgeRow.className = "badge-row";

      const groundedBadge = document.createElement("span");
      groundedBadge.className = "badge " + (data.grounded ? "green" : "red");
      groundedBadge.textContent = data.grounded ? "Grounded" : "Not fully grounded";
      badgeRow.appendChild(groundedBadge);

      if (data.status && data.status !== "ok") {
        const statusBadge = document.createElement("span");
        statusBadge.className = "badge amber";
        statusBadge.textContent = data.status;
        badgeRow.appendChild(statusBadge);
      }
      bubble.appendChild(badgeRow);

      bubble.appendChild(renderStructuredAnswer(data.answer || ""));

      if (data.status === "step_limit" || data.status === "timeout") {
        const noteEl = document.createElement("div");
        noteEl.className = "status-note";
        noteEl.textContent =
          data.status === "step_limit"
            ? "Note: Agent reached the maximum tool round limit (8) and returned partial evidence."
            : "Note: Agent reached the 60s timeout and returned partial evidence.";
        bubble.appendChild(noteEl);
      }

      if (Array.isArray(data.citations) && data.citations.length > 0) {
        const citationsBox = document.createElement("div");
        citationsBox.className = "citations";

        const title = document.createElement("div");
        title.className = "citations-title";
        title.textContent = "Citations";
        citationsBox.appendChild(title);

        const list = document.createElement("ul");
        list.className = "citation-list";

        for (const cit of data.citations) {
          const li = document.createElement("li");
          li.className = "citation-item";

          const loc = document.createElement("span");
          loc.textContent = cit.path + ":" + cit.start_line + "-" + cit.end_line;
          li.appendChild(loc);

          const badge = document.createElement("span");
          badge.className = "badge " + (cit.verified ? "green" : "red");
          badge.textContent = cit.verified ? "verified" : "unverified";
          li.appendChild(badge);

          list.appendChild(li);
        }

        citationsBox.appendChild(list);
        bubble.appendChild(citationsBox);
      }

      if (Array.isArray(data.trace) && data.trace.length > 0) {
        const details = document.createElement("details");
        details.className = "trace-box";

        const summary = document.createElement("summary");
        summary.textContent = "Agent steps (" + data.trace.length + ")";
        details.appendChild(summary);

        const traceList = document.createElement("ol");
        traceList.className = "trace-list";

        for (const step of data.trace) {
          const li = document.createElement("li");
          li.className = "trace-step";
          const inputText = JSON.stringify(step.input || {});
          li.textContent =
            step.tool + "(" + inputText + ") -> " + (step.result_summary || "");
          traceList.appendChild(li);
        }

        details.appendChild(traceList);
        bubble.appendChild(details);
      }

      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
    }

    const sampleChips = document.querySelectorAll(".sample-chip");

    function setSendingState(sending) {
      isRequestInFlight = sending;
      sendBtn.disabled = sending;
      questionInput.disabled = sending;
      sampleChips.forEach((chip) => {
        chip.disabled = sending;
      });
    }

    async function handleIndexClick() {
      indexBtn.disabled = true;
      const originalText = indexBtn.textContent;
      indexBtn.textContent = "Indexing...";
      try {
        const res = await fetch("/index", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });
        const data = await parseJsonSafe(res);
        if (!res.ok) {
          throw new Error(data.detail || "HTTP " + res.status);
        }
        renderIndexStatus(data);
      } catch (err) {
        appendErrorMessage("Indexing failed: " + err.message);
      } finally {
        indexBtn.disabled = false;
        indexBtn.textContent = originalText;
      }
    }

    async function handleSend() {
      if (isRequestInFlight) return;
      const question = questionInput.value.trim();
      if (!question) return;

      questionInput.value = "";
      appendUserMessage(question);
      setSendingState(true);

      const thinkingEl = document.createElement("div");
      thinkingEl.className = "thinking";
      thinkingEl.textContent = "Thinking...";
      chatEl.appendChild(thinkingEl);
      scrollToBottom();

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 65000);
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
          signal: controller.signal,
        });
        const data = await parseJsonSafe(res);
        if (!res.ok) {
          throw new Error(data.detail || "HTTP " + res.status);
        }
        if (thinkingEl.parentNode) thinkingEl.parentNode.removeChild(thinkingEl);
        appendAgentMessage(data);
      } catch (err) {
        if (thinkingEl.parentNode) thinkingEl.parentNode.removeChild(thinkingEl);
        const msg =
          err.name === "AbortError"
            ? "Request timed out after 65s. Check the uvicorn terminal for rate limits or errors."
            : err.message;
        appendErrorMessage(msg);
      } finally {
        clearTimeout(timeoutId);
        setSendingState(false);
        questionInput.focus();
      }
    }

    indexBtn.addEventListener("click", handleIndexClick);
    sendBtn.addEventListener("click", handleSend);
    sampleChips.forEach((chip) => {
      chip.addEventListener("click", () => {
        if (isRequestInFlight) return;
        questionInput.value = chip.getAttribute("data-question") || "";
        handleSend();
      });
    });
    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        handleSend();
      }
    });

    fetchIndexStatus();
  </script>
</body>
</html>
